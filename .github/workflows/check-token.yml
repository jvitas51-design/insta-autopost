name: Проверка токена
on:
  workflow_dispatch:
  push:
    paths: ['tools/check_token.py','.github/workflows/check-token.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_token.py 2>&1 | tee logs/check_token.txt; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_AUTOPOSTING }}
      - if: always()
        run: |
          git config user.name "autopost-bot"; git config user.email "autopost-bot@users.noreply.github.com"
          git add logs/check_token.txt && git commit -m "log: token check" && git push || true
