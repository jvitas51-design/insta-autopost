name: Автопостинг
on:
  schedule:
    - cron: '3 15,16,17 * * *'   # 18:03 по Киеву летом и зимой; скрипт сам решает, пора ли
  workflow_dispatch:
    inputs:
      force:
        description: 'Опубликовать ряд прямо сейчас (1 = да)'
        default: '0'
permissions:
  contents: write
concurrency: autopost
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
      - run: pip install -q -r requirements.txt
      - run: python app/main.py run 2>&1 | tee logs/run.txt; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_AUTOPOSTING }}
          SITNIKS_API_KEY: ${{ secrets.SITNIKS_API_KEY }}
          FORCE: ${{ github.event.inputs.force || '0' }}
      - if: always()
        run: |
          git config user.name autopost-bot; git config user.email autopost-bot@users.noreply.github.com
          git pull -q --rebase || true
          git add logs/run.txt cache && git commit -qm "log: run" && git push -q || true
