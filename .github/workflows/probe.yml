name: Разведка
on: {push: {paths: ['tools/probe.py']}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py 2>&1 | tee logs/probe.txt
        env:
          SITNIKS_API_KEY: ${{ secrets.SITNIKS_API_KEY }}
          SITNIKS_KEY: ${{ secrets.SITNIKS_KEY }}
          SITNIKS_TOKEN: ${{ secrets.SITNIKS_TOKEN }}
          SITNIKS_API_TOKEN: ${{ secrets.SITNIKS_API_TOKEN }}
          SITNIKS: ${{ secrets.SITNIKS }}
          SITNIKS_API: ${{ secrets.SITNIKS_API }}
      - if: always()
        run: |
          git config user.name autopost-bot; git config user.email autopost-bot@users.noreply.github.com
          git add logs/probe.txt && git commit -qm "log: probe" && git push -q || true
