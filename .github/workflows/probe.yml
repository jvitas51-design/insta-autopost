name: Разведка сайта
on:
  workflow_dispatch:
  push:
    paths: ['tools/probe.py','.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py | tee logs/probe.txt
      - if: always()
        run: |
          git config user.name "autopost-bot"; git config user.email "autopost-bot@users.noreply.github.com"
          git add logs && git commit -m "log: probe" && git push || true
